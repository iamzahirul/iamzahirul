<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="About Zahirul Islam, written as a code object: role, base, organisations, experience, focus, stack, partners, education and side work">
  <style>

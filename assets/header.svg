  </g>
  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <g clip-path="url(#c1)">
      <text x="40" y="86" font-size="18" fill="#c9d1d9"><tspan fill="#39d353">$</tspan> whoami</text>
    </g>
    <g clip-path="url(#c2)">
      <text x="38" y="142" font-size="44" font-weight="700" fill="url(#nameG)">Zahirul Islam</text>
    </g>
    <g clip-path="url(#c3)">
      <text x="40" y="186" font-size="18" fill="#e6edf3"><tspan fill="#58a6ff">&gt;</tspan> Senior Research, MEAL &amp; MIS Specialist</text>
    </g>
    <g clip-path="url(#c4)">
      <text x="40" y="218" font-size="16" fill="#8b949e"><tspan fill="#58a6ff">&gt;</tspan> 13+ yrs · 107 studies · 30+ partners · 82 live systems</text>
    </g>
    <g clip-path="url(#c5)">
      <text x="40" y="250" font-size="16" fill="#8b949e"><tspan fill="#58a6ff">&gt;</tspan> field data in, decision-ready evidence out</text>
    </g>
    <rect x="458" y="236" width="10" height="18" fill="#39d353" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.001;0.002;0.5;0.501;1" begin="6s" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="290" font-size="12" fill="#484f58" opacity="0">
      iamzahirul.com  ·  github.com/iamzahirul
      <animate attributeName="opacity" from="0" to="1" begin="6.2s" dur="0.8s" fill="freeze"/>
    </text>
  </g>

  <!-- analytics panel -->

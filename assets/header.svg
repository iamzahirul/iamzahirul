      <line x1="668" y1="180" x2="944" y2="180"/>
      <line x1="668" y1="230" x2="944" y2="230"/>
      <line x1="668" y1="264" x2="944" y2="264" stroke="#30363d"/>
    </g>
    <g>
      <rect fill="url(#b1)" x="676" width="20" rx="3" y="214" height="50"><animate attributeName="height" values="50;90;60;50" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="214;174;204;214" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b2)" x="710" width="20" rx="3" y="194" height="70"><animate attributeName="height" values="70;40;100;70" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="194;224;164;194" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b3)" x="744" width="20" rx="3" y="174" height="90"><animate attributeName="height" values="90;120;70;90" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="174;144;194;174" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b4)" x="778" width="20" rx="3" y="204" height="60"><animate attributeName="height" values="60;85;110;60" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="204;179;154;204" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b5)" x="812" width="20" rx="3" y="164" height="100"><animate attributeName="height" values="100;70;130;100" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="164;194;134;164" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b6)" x="846" width="20" rx="3" y="144" height="120"><animate attributeName="height" values="120;140;95;120" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="144;124;169;144" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b7)" x="880" width="20" rx="3" y="134" height="130"><animate attributeName="height" values="130;100;150;130" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="134;164;114;134" dur="4s" repeatCount="indefinite"/></rect>
      <rect fill="url(#b8)" x="914" width="20" rx="3" y="124" height="140"><animate attributeName="height" values="140;155;120;140" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="124;109;144;124" dur="4s" repeatCount="indefinite"/></rect>
    </g>
    <polyline points="686,220 720,196 754,182 788,190 822,160 856,140 890,126 924,108" fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;0;320" keyTimes="0;0.4;0.85;1" dur="5s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="924" cy="108" r="4" fill="#e6edf3">

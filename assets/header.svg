<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Zahirul Islam — Data Analyst and Research Specialist, building free offline Bangla tools">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowG" cx="80%" cy="70%" r="55%">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="15%" cy="10%" r="45%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameG" x1="0" x2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#0e4429"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7b72"/><stop offset="1" stop-color="#5a1e1b"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa657"/><stop offset="1" stop-color="#5c3412"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b341"/><stop offset="1" stop-color="#4d3a0a"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#0e4429"/></linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39c5cf"/><stop offset="1" stop-color="#0b3d42"/></linearGradient>
    <linearGradient id="b6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#0c2d6b"/></linearGradient>
    <linearGradient id="b7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bc8cff"/><stop offset="1" stop-color="#3b1f6b"/></linearGradient>
    <linearGradient id="b8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f778ba"/><stop offset="1" stop-color="#5c1d3e"/></linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="320" rx="14"/></clipPath>
    <clipPath id="c1"><rect x="36" y="60" height="40" width="0"><animate attributeName="width" from="0" to="120" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="36" y="100" height="56" width="0"><animate attributeName="width" from="0" to="420" begin="1.1s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="36" y="164" height="30" width="0"><animate attributeName="width" from="0" to="480" begin="2.2s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="36" y="198" height="28" width="0"><animate attributeName="width" from="0" to="590" begin="3.5s" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="36" y="230" height="28" width="0"><animate attributeName="width" from="0" to="440" begin="5s" dur="1s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="#0d1117"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" fill="url(#glowG)"/>
    <rect width="1000" height="320" fill="url(#glowB)"/>

